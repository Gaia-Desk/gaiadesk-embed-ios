# The two example apps, as one Xcode project (generated with XcodeGen:
# `cd Examples && xcodegen`; the generated HelpDeskExamples.xcodeproj is
# committed, so XcodeGen is only needed to change it). Both depend on this
# package by path; to use the local XCFramework, set
# GAIADESK_EMBED_LOCAL_BINARY=1 in the environment Xcode is started from (or
# for xcodebuild).
name: HelpDeskExamples
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  GaiaDeskEmbed:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HelpDeskUIKit:
    type: application
    platform: iOS
    sources: [HelpDeskUIKit/Sources]
    dependencies:
      - package: GaiaDeskEmbed
    info:
      path: HelpDeskUIKit/Info.plist
      properties:
        CFBundleDisplayName: Acme Bank (UIKit)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [helpdeskuikit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaiadesk.examples.helpdesk.uikit
        GENERATE_INFOPLIST_FILE: "NO"
  HelpDeskSwiftUI:
    type: application
    platform: iOS
    sources: [HelpDeskSwiftUI/Sources]
    dependencies:
      - package: GaiaDeskEmbed
    info:
      path: HelpDeskSwiftUI/Info.plist
      properties:
        CFBundleDisplayName: Acme Bank (SwiftUI)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [helpdeskswiftui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaiadesk.examples.helpdesk.swiftui
        GENERATE_INFOPLIST_FILE: "NO"
  # The package's XCTest suite hosted in an app (UIKit delivers control actions
  # and first responder only in a real app's window scene):
  #   xcodebuild test -project Examples/HelpDeskExamples.xcodeproj -scheme GaiaDeskEmbedTests \
  #     -destination 'platform=iOS Simulator,name=iPhone 17'
  # (`xcodebuild test -scheme GaiaDeskEmbed` at the root runs it hostless: the
  # UIKit-delivery tests skip there.)
  GaiaDeskEmbedTestHost:
    type: application
    platform: iOS
    sources:
      - path: GaiaDeskEmbedTestHost/Sources
    info:
      path: GaiaDeskEmbedTestHost/Info.plist
      properties:
        CFBundleDisplayName: GaiaDeskEmbed Tests
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaiadesk.embed.testhost
        GENERATE_INFOPLIST_FILE: "NO"
  GaiaDeskEmbedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/GaiaDeskEmbedTests
    dependencies:
      - target: GaiaDeskEmbedTestHost
      - package: GaiaDeskEmbed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaiadesk.embed.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GaiaDeskEmbedTestHost.app/GaiaDeskEmbedTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GaiaDeskEmbedTests:
    build:
      targets:
        GaiaDeskEmbedTestHost: all
        GaiaDeskEmbedTests: [test]
    test:
      targets: [GaiaDeskEmbedTests]
